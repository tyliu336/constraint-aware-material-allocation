name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: material_allocation_test
          POSTGRES_USER: material_allocation
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U material_allocation -d material_allocation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,pilot]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: Verify PostgreSQL migrations
        env:
          MAC_ENVIRONMENT: test
          MAC_TEST_DATABASE_URL: postgresql+psycopg://material_allocation:ci-only-password@127.0.0.1:5432/material_allocation_test
        run: |
          alembic upgrade head
          alembic check
