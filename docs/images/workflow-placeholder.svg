<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Constraint-Aware Material Allocation workflow</title>
  <desc id="desc">Three cards representing material import, structure description, and preference input.</desc>
  <rect width="1200" height="520" rx="24" fill="#f4f1e8"/>
  <text x="64" y="82" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#18352c">Constraint-Aware Material Allocation</text>
  <g font-family="Arial, sans-serif">
    <rect x="64" y="132" width="310" height="290" rx="18" fill="#ffffff" stroke="#b8c8bd" stroke-width="2"/>
    <circle cx="112" cy="182" r="24" fill="#246b55"/><text x="105" y="191" font-size="24" fill="#fff">1</text>
    <text x="150" y="192" font-size="25" font-weight="700" fill="#18352c">木料录入</text>
    <text x="96" y="255" font-size="18" fill="#486158">CSV / JSON</text>
    <text x="96" y="292" font-size="18" fill="#486158">尺寸、等级、缺陷记录</text>
    <text x="96" y="329" font-size="18" fill="#486158">来源与文件哈希</text>
    <rect x="445" y="132" width="310" height="290" rx="18" fill="#ffffff" stroke="#b8c8bd" stroke-width="2"/>
    <circle cx="493" cy="182" r="24" fill="#246b55"/><text x="486" y="191" font-size="24" fill="#fff">2</text>
    <text x="531" y="192" font-size="25" font-weight="700" fill="#18352c">描述结构</text>
    <line x1="520" y1="270" x2="680" y2="230" stroke="#246b55" stroke-width="5"/>
    <line x1="680" y1="230" x2="640" y2="350" stroke="#246b55" stroke-width="5"/>
    <line x1="640" y1="350" x2="520" y2="270" stroke="#246b55" stroke-width="5"/>
    <circle cx="520" cy="270" r="9" fill="#d7873f"/><circle cx="680" cy="230" r="9" fill="#d7873f"/><circle cx="640" cy="350" r="9" fill="#d7873f"/>
    <rect x="826" y="132" width="310" height="290" rx="18" fill="#ffffff" stroke="#b8c8bd" stroke-width="2"/>
    <circle cx="874" cy="182" r="24" fill="#246b55"/><text x="867" y="191" font-size="24" fill="#fff">3</text>
    <text x="912" y="192" font-size="25" font-weight="700" fill="#18352c">提示词输入</text>
    <rect x="858" y="236" width="246" height="90" rx="12" fill="#f7f9f7" stroke="#b8c8bd"/>
    <text x="880" y="274" font-size="17" fill="#486158">优先减少余料，</text>
    <text x="880" y="302" font-size="17" fill="#486158">并减少表面节疤。</text>
    <rect x="858" y="350" width="140" height="42" rx="21" fill="#246b55"/>
    <text x="884" y="378" font-size="17" fill="#fff">生成方案</text>
  </g>
</svg>
